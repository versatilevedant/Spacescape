<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spacescape - 2D Retro Space Shooter</title>
  <link rel="icon" type="image/png" href="/game/assets_custom/player.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gameCanvas {
      display: block;
      background-color: #000000;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: 100vh;
      aspect-ratio: 9 / 16;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      cursor: crosshair;
    }

    @media (max-aspect-ratio: 9/16) {
      #gameCanvas {
        width: 100vw;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="540" height="960"></canvas>
  <script src="/game/game.js"></script>
</body>
</html>
